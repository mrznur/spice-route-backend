server:
  port: 8080

spring:
  profiles:
    default: local
  application:
    name: feedback
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/feedback}
    username: ${DB_USER:feedback}
    password: ${DB_PASSWORD:feedback}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  gemini:
    api-key: ${GEMINI_API_KEY:disabled}
    model: ${GEMINI_MODEL:gemini-flash-lite-latest}
    timeout-seconds: ${GEMINI_TIMEOUT:20}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-minutes: 15
    refresh-days: 7
  superadmin:
    email: ${SUPERADMIN_EMAIL:admin@spiceroute.local}
    password: ${SUPERADMIN_PASSWORD:ChangeMe123!}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
